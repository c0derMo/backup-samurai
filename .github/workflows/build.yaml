name: Build and attach release assets

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            goos: linux
            extension: ""
          - os: windows
            runner: windows-latest
            goos: windows
            extension: .exe
          - os: macos
            runner: macos-latest
            goos: darwin
            extension: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26.2

      - name: Set build metadata
        shell: bash
        run: |
          echo "VERSION=$(git describe --tags --abbrev=0)" >> "$GITHUB_ENV"
          echo "COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> "$GITHUB_ENV"

      - name: Build binary
        shell: bash
        run: |
          echo "Building for ${{ matrix.os }} (GOOS=${{ matrix.goos }})"
          mkdir -p dist
          GOOS=${{ matrix.goos }} \
          GOARCH=amd64 \
          go build \
            -ldflags "\
              -X 'c0dermo/backup-samurai/lib.Version=$VERSION' \
              -X 'c0dermo/backup-samurai/lib.CommitHash=$COMMIT' \
              -X 'c0dermo/backup-samurai/lib.BuildTimestamp=$BUILD_TIME' \
            " \
            -o dist/backup_samurai_${{ matrix.os }}_amd64${{ matrix.extension }} .

      - name: Upload to release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: dist/backup_samurai_${{ matrix.os }}_amd64${{ matrix.extension }}
          asset_name: backup_samurai_${{ matrix.os }}_amd64${{ matrix.extension }}
          asset_content_type: application/octet-stream